<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Easy Thermostat Styler Card — screenshots</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --rgb-primary-color: 3, 169, 244;
        --accent-color: #ff9800;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c;
        --secondary-background-color: #282828;
        --divider-color: #3a3a3a;
        --ha-card-border-radius: 16px;
        color-scheme: dark;
      }
      body { background: #111; color: #e1e1e1; font-family: Roboto, 'Segoe UI', sans-serif; margin: 0; padding: 24px; }
      .wall { display: flex; flex-direction: column; gap: 32px; align-items: flex-start; }
      /* Padding leaves room for the card glow and for menus that open outside the card. */
      .shot { width: 400px; padding: 14px; }
    </style>
    <script type="module" src="./shots.js"></script>
  </head>
  <body>
    <div class="wall" id="wall"></div>
  </body>
</html>
